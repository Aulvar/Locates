# .github/DISCUSSION_TEMPLATE/general.yml

title: Welcome to Locates Discussions!
labels:
  - community
body:
  - type: markdown
    attributes:
      value: |
        # Welcome to Locates Discussions

        Use discussions to:
        - Talk about translations
        - Suggest new languages
        - Ask questions
        - Share ideas
        - Report missing text

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select a discussion category
      options:
        - Announcements
        - Updates from maintainers
        - Q&A
        - Translation Suggestions
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Discussion
      description: Write your discussion here
      placeholder: Start typing...
    validations:
      required: true
